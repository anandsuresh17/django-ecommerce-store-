<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email | NOVA</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f7;
            color: #1d1d1f;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            padding: 40px 32px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
        }

        .logo {
            font-size: 30px;
            font-weight: bold;
            letter-spacing: 3px;
            margin-bottom: 28px;
        }

        h1 {
            font-size: 26px;
            margin-bottom: 12px;
        }

        .description {
            color: #6e6e73;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #d2d2d7;
            border-radius: 10px;
            font-size: 20px;
            text-align: center;
            letter-spacing: 8px;
            margin-bottom: 20px;
            outline: none;
        }

        input:focus {
            border-color: #0071e3;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #0071e3;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0077ed;
        }

        .messages {
            margin-bottom: 16px;
            font-size: 14px;
        }

        .error {
            color: #d93025;
            margin-bottom: 8px;
        }

        .success {
            color: #188038;
            margin-bottom: 8px;
        }

        .back-link {
            display: inline-block;
            margin-top: 22px;
            color: #0071e3;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="logo">NOVA</div>

        <h1>Verify your email</h1>

        <p class="description">
            Enter the verification code sent to your registered email
            address to continue resetting your password.
        </p>

        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <p class="{% if message.tags == 'error' %}error{% else %}success{% endif %}">
                        {{ message }}
                    </p>
                {% endfor %}
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <input
                type="text"
                name="otp"
                placeholder="••••••"
                inputmode="numeric"
                pattern="[0-9]{6}"
                maxlength="6"
                minlength="6"
                autocomplete="one-time-code"
                required
                aria-label="Six-digit verification code"
            >

            <button type="submit">Verify Code</button>
        </form>

        <a href="{% url 'forgot_password' %}" class="back-link">
            Back to Forgot Password
        </a>
    </div>
</body>
</html>
